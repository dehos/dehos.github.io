name: Build Kalkulator Rangka APK

on:
  workflow_dispatch:
  push:
    branches: [kalkulator-rangka-app]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: Build APK
        run: gradle --no-daemon assembleDebug
      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk Kalkulator-Rangka.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Kalkulator-Rangka-APK
          path: Kalkulator-Rangka.apk
          if-no-files-found: error
          retention-days: 30
