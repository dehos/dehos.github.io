name: React migration build check

permissions:
  contents: read

on:
  pull_request:
    paths:
      - "migration/react-vite/**"
      - ".github/workflows/react-migration-check.yml"
  push:
    branches:
      - "migration/react-vite-foundation"
    paths:
      - "migration/react-vite/**"
      - ".github/workflows/react-migration-check.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: migration/react-vite
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Resolve dependencies and generate lockfile
        run: npm install
      - name: Verify clean lockfile installation
        run: npm ci
      - name: Audit dependency vulnerabilities
        run: npm audit --audit-level=high
      - name: Run stock calculation regression tests
        run: npm test
      - name: Build production bundle
        run: npm run build

      - name: Upload generated dependency lockfile
        uses: actions/upload-artifact@v4
        with:
          name: react-migration-package-lock
          path: migration/react-vite/package-lock.json
          if-no-files-found: error
