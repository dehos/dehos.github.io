<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Aplikasi rekap stok barang dan transaksi penjualan." />
    <title>Stock Barang</title>
    <link rel="icon" type="image/svg+xml" sizes="any" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <script>
      // Terapkan tema tersimpan sebelum render pertama agar tidak berkedip.
      (function () {
        var theme = "tosca";
        try { theme = localStorage.getItem("dhouse-theme") || "tosca"; } catch (e) {}
        if (["tosca", "maroon", "adminlte"].indexOf(theme) === -1) theme = "tosca";
        document.documentElement.setAttribute("data-theme", theme);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
